[package]
name = "wib"
version = "0.1.0"
edition = "2021"
description = "Suggest previously used shell commands from zsh history while you type"
license = "MIT"

[[bin]]
name = "wib"
path = "src/main.rs"

[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
