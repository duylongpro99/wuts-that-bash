<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>wib logo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@1,400&family=Cutive+Mono&family=Nunito+Sans:wght@400;700&display=swap">
<link rel="stylesheet" href="common.css">
<style>
  .stage { width: 1024px; height: 1024px; }
  svg.logo { position: absolute; inset: 0; z-index: 1; }
</style>
</head>
<body>
<div class="stage" id="stage">
  <!-- A notebook-page terminal: the red prompt chevron, the name, and two pencilled
       suggestion lines under it (the first one picked out, like wib's selected line). -->
  <svg class="logo" width="1024" height="1024" viewBox="0 0 1024 1024">
    <g id="card">
      <rect x="118" y="146" width="788" height="732" fill="url(#pp-hatch)" opacity="0.55" transform="translate(22 22)"/>
      <rect x="118" y="146" width="788" height="732" fill="#fbf7ee"/>
      <rect x="118" y="146" width="788" height="110" fill="#c4dbe8" filter="url(#pp-pencil)" opacity="0.8"/>
      <line x1="118" y1="256" x2="906" y2="256" stroke="#1d1a1e" stroke-width="7" filter="url(#pp-ink-u)"/>
      <rect x="118" y="146" width="788" height="732" fill="none" stroke="#1d1a1e" stroke-width="12" stroke-linejoin="round" filter="url(#pp-ink)"/>
      <rect x="118" y="146" width="788" height="732" fill="none" stroke="#1d1a1e" stroke-width="9" stroke-linejoin="round" filter="url(#pp-ink-b)" opacity="0.45"/>
      <!-- three ink rings on the title bar -->
      <g fill="#fbf7ee" stroke="#1d1a1e" stroke-width="6" filter="url(#pp-ink)">
        <circle cx="186" cy="201" r="17"/><circle cx="246" cy="201" r="17"/><circle cx="306" cy="201" r="17"/>
      </g>
    </g>
    <!-- chevron + name -->
    <path d="M196 382 L292 450 L196 518" fill="none" stroke="#a8443b" stroke-width="30" stroke-linecap="round" stroke-linejoin="round" filter="url(#pp-ink)"/>
    <text x="340" y="520" font-family="Cutive Mono" font-size="230" fill="#21201f">wib</text>
    <!-- suggestion lines: the first is the selected one -->
    <rect x="186" y="608" width="652" height="74" fill="#e0b04f" filter="url(#pp-pencil)" opacity="0.55"/>
    <g stroke="#1d1a1e" stroke-linecap="round" fill="none">
      <line x1="226" y1="645" x2="760" y2="645" stroke-width="18" filter="url(#pp-ink-u)"/>
      <line x1="226" y1="752" x2="620" y2="752" stroke-width="16" opacity="0.45" filter="url(#pp-ink-bu)"/>
    </g>
  </svg>
</div>
<script src="common.js"></script>
<script>
  ready().then(() => { paperBackground(document.getElementById("stage")); window.__ready = true; });
</script>
</body>
</html>
